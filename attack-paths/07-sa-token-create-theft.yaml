apiVersion: v1
kind: Namespace
metadata:
  name: 07-token-theft
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: victim-admin-role
  namespace: 07-token-theft
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: privileged-sa
  namespace: 07-token-theft
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rb-privileged-sa
  namespace: 07-token-theft
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: victim-admin-role
subjects:
- kind: ServiceAccount
  name: privileged-sa
  namespace: 07-token-theft
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-token-thief
  namespace: 07-token-theft
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: token-minter
  namespace: 07-token-theft
rules:
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - serviceaccounts/token
  verbs:
  - create
  resourceNames:
  - privileged-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rb-token-minter
  namespace: 07-token-theft
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: token-minter
subjects:
- kind: ServiceAccount
  name: sa-token-thief
  namespace: 07-token-theft
---
apiVersion: v1
kind: Pod
metadata:
  name: attacker-pod
  namespace: 07-token-theft
spec:
  serviceAccountName: sa-token-thief
  automountServiceAccountToken: true
  containers:
    - name: attacker-container
      image: bitnami/kubectl:latest
      command: ["sleep", "infinity"]
