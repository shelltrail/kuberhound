apiVersion: v1
kind: Namespace
metadata:
  name: 10-token-secret-plant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: victim-admin-role
  namespace: 10-token-secret-plant
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-bot
  namespace: 10-token-secret-plant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rb-deploy-bot
  namespace: 10-token-secret-plant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: victim-admin-role
subjects:
- kind: ServiceAccount
  name: deploy-bot
  namespace: 10-token-secret-plant
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-manager
  namespace: 10-token-secret-plant
---
# Looks harmless: manage the application's Secrets, nothing else
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-editor
  namespace: 10-token-secret-plant
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rb-secret-manager
  namespace: 10-token-secret-plant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-editor
subjects:
- kind: ServiceAccount
  name: secret-manager
  namespace: 10-token-secret-plant
