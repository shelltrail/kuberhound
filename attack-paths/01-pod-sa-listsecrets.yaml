# Variant: watch-only grant also streams full secret data
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-watch-secrets
  namespace: 01-pod-sa-listsecrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: watch-secrets
  namespace: 01-pod-sa-listsecrets
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rb-sa-watch-secrets
  namespace: 01-pod-sa-listsecrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: watch-secrets
subjects:
- kind: ServiceAccount
  name: sa-watch-secrets
  namespace: 01-pod-sa-listsecrets
---
apiVersion: v1
kind: Pod
metadata:
  name: watch-pod
  namespace: 01-pod-sa-listsecrets
