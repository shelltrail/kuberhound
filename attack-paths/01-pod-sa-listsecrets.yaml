  automountServiceAccountToken: true
  containers:
    - name: vuln-container
      image: alpine:latest
      command: ["sleep", "infinity"]
---
# Control: list restricted by resourceNames only reaches the named secret
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-list-named
  namespace: 01-pod-sa-listsecrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: list-secrets-named
  namespace: 01-pod-sa-listsecrets
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - api-keys
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rb-sa-list-named
  namespace: 01-pod-sa-listsecrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: list-secrets-named
subjects:
- kind: ServiceAccount
  name: sa-list-named
  namespace: 01-pod-sa-listsecrets
---
apiVersion: v1
kind: Pod
metadata:
  name: named-pod
  namespace: 01-pod-sa-listsecrets
spec:
  serviceAccountName: sa-list-named
  automountServiceAccountToken: true
  containers:
    - name: vuln-container
      image: alpine:latest
      command: ["sleep", "infinity"]
---
